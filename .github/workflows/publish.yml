name: Publish 3D Tailwind portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore initial portfolio source
        run: |
          python3 - <<'PYTHON'
          import base64, io, zipfile
          from pathlib import Path
          if not Path('.portfolio-version').exists() or Path('.portfolio-version').read_text().strip() != 'reference-v5':
              zipfile.ZipFile(io.BytesIO(base64.b64decode(''))).extractall('.')
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Save readable portfolio source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .gitignore .portfolio-version package.json package-lock.json src dist
          if ! git diff --cached --quiet; then
            git commit -m "Redesign portfolio from references with tactile 3D interfaces and navy crimson identity"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
